# TRIMMED to ONE operation (POST /images/generations) from the real OpenAI spec.
# Source: https://raw.githubusercontent.com/openai/openai-openapi/f601a440c21397028cad2218eca1afd701bf12ec/openapi.yaml  (2026-10-15)
# Compared pair: 5162af98 (2026-05-13) -> f601a440 (2026-10-15, 'Add safety_identifier parameter to replace deprecated user field').
# Schemas inlined (no $ref/allOf), nullable/anyOf wrappers and x-* extensions dropped, long descriptions shortened; property names, types, required list kept.
# Properties kept: prompt, model, n, size, user, safety_identifier. Other real properties (quality, style, ...) omitted.
openapi: 3.0.3
info:
  title: OpenAI API (images generations, trimmed)
  version: 2026-10-15
paths:
  /images/generations:
    post:
      operationId: createImage
      summary: Create image
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, prompt]
              properties:
                prompt:
                  type: string
                  description: A text description of the desired image(s).
                model:
                  type: string
                  description: The GPT image model to use for image generation. Specify a model explicitly.
                n:
                  type: integer
                  minimum: 1
                  maximum: 10
                  description: The number of images to generate. Must be between 1 and 10.
                size:
                  type: string
                  description: The size of the generated images, for example 1024x1024.
                safety_identifier:
                  type: string
                  maxLength: 128
                  description: A stable identifier for an end user in your organization, used for safety monitoring and abuse detection. Hash a username or email address.
                user:
                  type: string
                  deprecated: true
                  description: 'Deprecated: use safety_identifier instead. Still accepted for backward compatibility.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: {type: integer}
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        b64_json: {type: string}

